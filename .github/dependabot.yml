version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@chirag127/*"   # workspace/path deps Dependabot can't resolve
      # file: protocol local workspace dep — not resolvable by Dependabot
      - dependency-name: "@chirag127/oz-ai"
    groups:
      production-minor-patch:
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch", "major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
